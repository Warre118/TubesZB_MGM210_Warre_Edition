# TubesZB MGM210 Warre Edition - ESPHome config for the TubesZB EFR32 MGM210 2022 (eth_usb, WT32-ETH01)
#
# Based on tube0013's config (tubeszb-efr32-mgm210-2022.original.yaml in the homelab folder), changes:
#  - stream_server (tube's external component, no longer maintained) replaced by the built-in
#    uart_tcp (ESPHome >= 2026.10). Same port 6638, so ZHA / Zigbee2MQTT notice nothing.
#  - web_server v3 with groups, layout via tubeszb-webui.js (centred, two columns;
#    Maintenance and a Debug Log window side by side after "Show All"). local: false is required for that: ESPHome only adds
#    js_include to the page when the app is loaded from oi.esphome.io (browser needs internet).
#    Maintenance buttons are "disabled_by_default": on the web page only visible via "Show all",
#    disabled in Home Assistant by default.
#  - Web login with a first-run "Create login" dialog (warre_auth.h, next to this config): the
#    username/password are set on the page itself and kept in flash, not in this file.
#  - internal_temperature left out: reports "NA" on this older ESP32.
#  - Radio firmware updates (components/efr32_radio, next to this config): an update entity that
#    offers the build of the selected channel (stable / latest / beta) and stack (Zigbee
#    coordinator / Thread / Zigbee router, the router with join and leave buttons)
#    from the "firmware" branch of this repository, with release notes, and flashes the EFR32 from
#    Home Assistant or this device's web page. Manifests are signed; the image is checked against
#    the signed checksum before anything is sent to the radio. See docs/radio-updates.md.
# Requires ESPHome 2026.10 or newer. Secrets: see secrets.example.yaml.

substitutions:
  name: tubeszb-warre-edition
  friendly_name: "TubesZB MGM210 Warre Edition"
  # Radio firmware that is on the EFR32 until the first install through the "Radio firmware"
  # update entity; from then on the device remembers what it flashed.
  efr32_installed_firmware: zigbee_ncp
  efr32_installed_version: "9.1.1.1"
  # Where the firmware builds are published (fwpipe, see the px30-wallpanel repo, updater/).
  radio_firmware_url: https://raw.githubusercontent.com/Warre118/TubesZB_MGM210_Warre_Edition/firmware
  efr32_chip: "MGM210PA32JIA2"
  efr32_stack: "EmberZNet 9.1.1"
  efr32_fw_type: "EZSP v19"
  efr32_interface: "UART over TCP 6638"
  efr32_baudrate: "115200"
  efr32_flow_control: "Software (XON/XOFF)"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: warre.tubeszb_mgm210
    version: "1.4.0"
  # Web login module (see the comments in the file).
  includes:
    - warre_auth.h
  on_boot:
    # 600: after flash preferences are available, before the web server starts.
    priority: 600
    then:
      - lambda: warre_auth::begin();

external_components:
  - source:
      type: local
      path: components
    components: [efr32_radio]

esp32:
  board: esp-wrover-kit
  framework:
    type: arduino
    advanced:
      minimum_chip_revision: "3.1"

# WT32-ETH01 Ethernet
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_EXT_IN
    pin:
      number: 0
      ignore_strapping_warning: true
  phy_addr: 1
  power_pin: GPIO16

# INFO: connects/disconnects, OTA, warnings and errors show up in the log window
# without the per-sensor DEBUG noise.
logger:
  level: INFO

api:
  reboot_timeout: 0s
  encryption:
    key: !secret tubeszb_api_key

ota:
  platform: esphome
  id: my_ota
  password: !secret tubeszb_ota_password

safe_mode:

debug:
  update_interval: 30s

web_server:
  port: 80
  version: 3
  # false: the page loads the web app from oi.esphome.io; only then is js_include loaded.
  local: false
  log: true
  # Placeholder only, needed so ESPHome compiles the login code in. The real username/password
  # are created on the page (first run) and stored in flash by warre_auth.h; these values are
  # never used.
  auth:
    username: "placeholder"
    password: "placeholder-not-used"
    type: digest
  # Layout: centred, groups in two columns, log window next to Maintenance (file next to this config).
  js_include: tubeszb-webui.js
  sorting_groups:
    - id: grp_zigbee
      name: "Zigbee radio"
      sorting_weight: 10
    - id: grp_radio_fw
      name: "Radio firmware"
      sorting_weight: 15
    - id: grp_network
      name: "Network"
      sorting_weight: 20
    - id: grp_gateway
      name: "Gateway (ESP32)"
      sorting_weight: 30
    - id: grp_tech
      name: "Technical info"
      sorting_weight: 35
    - id: grp_maintenance
      name: "Maintenance"
      sorting_weight: 40

# --- Serial bridge to the EFR32 ------------------------------------------------------------

uart:
  id: uart_bus
  rx_pin: GPIO17
  tx_pin:
    number: GPIO5
    ignore_strapping_warning: true
  baud_rate: 115200
  rx_buffer_size: 1024

uart_tcp:
  - id: zigbee_tcp
    uart_id: uart_bus
    role: server
    port: 6638
    # Only accept clients from the local network. Adjust to your own subnet.
    allowed_ips:
      - 192.168.2.0/24

mdns:
  services:
    - service: "_tubeszb"
      protocol: "_tcp"
      port: 6638
      txt:
        version: "1.0"
        name: "TubesZB"
        radio_type: "ezsp"
        baud_rate: "115200"
        data_flow_control: "software"

# --- Radio firmware updates ----------------------------------------------------------------

# Downloads of the signed manifests and the firmware. verify_ssl is off because this ESP32 has
# no CA bundle in the Arduino build; integrity comes from the ECDSA signature on the manifest
# and the sha256 in it, both checked on the device before anything is flashed.
http_request:
  verify_ssl: false
  timeout: 20s

select:
  - platform: template
    id: radio_channel
    name: "Radio firmware channel"
    icon: mdi:source-branch
    entity_category: config
    options: [stable, latest, beta]
    initial_option: stable
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(radio_update).check();
    web_server:
      sorting_group_id: grp_radio_fw
      sorting_weight: 10

  - platform: template
    id: radio_stack
    name: "Radio firmware type"
    icon: mdi:layers-outline
    entity_category: config
    options:
      - "Zigbee (EmberZNet NCP)"
      - "Thread (OpenThread RCP)"
      - "Zigbee router"
    initial_option: "Zigbee (EmberZNet NCP)"
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(radio_update).check();
    web_server:
      sorting_group_id: grp_radio_fw
      sorting_weight: 20

update:
  - platform: efr32_radio
    id: radio_update
    name: "Radio firmware"
    serial_id: uart_bus
    base_url: ${radio_firmware_url}
    channel_select: radio_channel
    firmware_select: radio_stack
    reset_switch: zRST_gpio
    bootloader_switch: zBSL
    installed_firmware: ${efr32_installed_firmware}
    installed_version: ${efr32_installed_version}
    update_interval: 6h
    # Public half of the key that signs the published manifests (fwpipe signing_key).
    # Network state while the radio runs the Zigbee router firmware.
    router_status:
      name: "Zigbee router network"
      web_server:
        sorting_group_id: grp_radio_fw
        sorting_weight: 40
    public_key: |
      -----BEGIN PUBLIC KEY-----
      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEExQWZht3s+5vVLqNMEu0Wu0RUa3P
      B2SXmgaTk+w3aMvtW67DH0Z0KnQyftjl0hqNI7ANTnVrSWKJrh9CZZ37pQ==
      -----END PUBLIC KEY-----
    web_server:
      sorting_group_id: grp_radio_fw
      sorting_weight: 30

# --- Zigbee radio --------------------------------------------------------------------------

binary_sensor:
  - platform: uart_tcp
    uart_tcp_id: zigbee_tcp
    connected:
      name: "Zigbee client connected"
      icon: mdi:lan-connect
      web_server:
        sorting_group_id: grp_zigbee
        sorting_weight: 10

  - platform: status
    name: "Connected to Home Assistant"
    entity_category: diagnostic
    web_server:
      sorting_group_id: grp_gateway
      sorting_weight: 5

sensor:
  - platform: uart_tcp
    uart_tcp_id: zigbee_tcp
    disconnects:
      name: "Zigbee client disconnects (since boot)"
      icon: mdi:lan-disconnect
      entity_category: diagnostic
      accuracy_decimals: 0
      web_server:
        sorting_group_id: grp_zigbee
        sorting_weight: 20

  # Raw uptime in seconds: internal only, feeds the readable text below.
  - platform: uptime
    id: uptime_s
    internal: true
    update_interval: 60s

  - platform: debug
    free:
      name: "Free heap"
      icon: mdi:memory
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_gateway
        sorting_weight: 30
    block:
      name: "Largest free heap block"
      entity_category: diagnostic
      disabled_by_default: true
      web_server:
        sorting_group_id: grp_gateway
        sorting_weight: 31
    loop_time:
      name: "Main loop time"
      entity_category: diagnostic
      disabled_by_default: true
      web_server:
        sorting_group_id: grp_gateway
        sorting_weight: 32

text_sensor:
  - platform: template
    name: "Uptime"
    icon: mdi:timer-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (std::isnan(id(uptime_s).state)) return {"starting"};
      int s = (int) id(uptime_s).state;
      char buf[32];
      snprintf(buf, sizeof(buf), "%dd %02dh %02dm", s / 86400, (s % 86400) / 3600, (s % 3600) / 60);
      return std::string(buf);
    web_server:
      sorting_group_id: grp_gateway
      sorting_weight: 10

  - platform: template
    name: "Radio firmware installed"
    icon: mdi:zigbee
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      auto fw = id(radio_update).installed_firmware();
      auto v = id(radio_update).installed_version();
      std::string name = fw == "openthread_rcp" ? "OpenThread RCP" : fw == "zigbee_router" ? "Zigbee router" : "EmberZNet";
      return {name + " " + (v.empty() ? std::string("(unknown)") : v)};
    web_server:
      sorting_group_id: grp_zigbee
      sorting_weight: 5

  # --- Technical info (fixed text from substitutions) ---
  - platform: template
    name: "Chip"
    icon: mdi:chip
    entity_category: diagnostic
    update_interval: 1h
    lambda: return {"${efr32_chip}"};
    web_server:
      sorting_group_id: grp_tech
      sorting_weight: 10

  - platform: template
    name: "Zigbee stack"
    icon: mdi:layers-outline
    entity_category: diagnostic
    update_interval: 1h
    lambda: return {"${efr32_stack}"};
    web_server:
      sorting_group_id: grp_tech
      sorting_weight: 20

  - platform: template
    name: "Firmware type"
    icon: mdi:file-cog-outline
    entity_category: diagnostic
    update_interval: 1h
    lambda: return {"${efr32_fw_type}"};
    web_server:
      sorting_group_id: grp_tech
      sorting_weight: 30

  - platform: template
    name: "Interface"
    icon: mdi:serial-port
    entity_category: diagnostic
    update_interval: 1h
    lambda: return {"${efr32_interface}"};
    web_server:
      sorting_group_id: grp_tech
      sorting_weight: 40

  - platform: template
    name: "Baud rate"
    icon: mdi:speedometer
    entity_category: diagnostic
    update_interval: 1h
    lambda: return {"${efr32_baudrate}"};
    web_server:
      sorting_group_id: grp_tech
      sorting_weight: 50

  - platform: template
    name: "Flow control"
    icon: mdi:swap-horizontal
    entity_category: diagnostic
    update_interval: 1h
    lambda: return {"${efr32_flow_control}"};
    web_server:
      sorting_group_id: grp_tech
      sorting_weight: 60

  - platform: ethernet_info
    ip_address:
      name: "IP address"
      icon: mdi:ip-network
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_network
        sorting_weight: 10
    mac_address:
      name: "MAC address"
      icon: mdi:ethernet
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_network
        sorting_weight: 20

  - platform: version
    name: "ESPHome version"
    hide_timestamp: true
    entity_category: diagnostic
    web_server:
      sorting_group_id: grp_gateway
      sorting_weight: 40

  - platform: debug
    reset_reason:
      name: "Last reset reason"
      icon: mdi:restart-alert
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_gateway
        sorting_weight: 41

# --- EFR32 control lines (internal: only used by the buttons below) ------------------------

switch:
  - platform: gpio
    pin: 33
    id: zRST_gpio
    inverted: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: 32
    id: zBSL
    inverted: true
    restore_mode: ALWAYS_OFF

# --- Maintenance ---------------------------------------------------------------------------

button:
  - platform: template
    name: "Restart Zigbee radio"
    id: zRST
    icon: mdi:restart
    entity_category: config
    disabled_by_default: true
    on_press:
      - switch.turn_on: zRST_gpio
      - delay: 15ms
      - switch.turn_off: zRST_gpio
    web_server:
      sorting_group_id: grp_maintenance
      sorting_weight: 10

  # Puts the EFR32 into the Gecko bootloader (for flashing/recovery). ZHA loses the radio
  # until it is flashed or until "Restart Zigbee radio".
  - platform: template
    name: "Zigbee radio to bootloader (flash mode)"
    icon: mdi:chip
    entity_category: config
    disabled_by_default: true
    on_press:
      - switch.turn_on: zBSL
      - delay: 10ms
      - switch.turn_on: zRST_gpio
      - delay: 15ms
      - switch.turn_off: zRST_gpio
      - delay: 500ms
      - switch.turn_off: zBSL
    web_server:
      sorting_group_id: grp_maintenance
      sorting_weight: 20

  # Clears the web login; the page then shows the "Create login" dialog again. Enabled in
  # Home Assistant on purpose: it is the way back in when the password is lost.
  # Hidden on the web page by tubeszb-webui.js (it is in the Login settings dialog there).
  - platform: template
    name: "Reset web login"
    icon: mdi:lock-reset
    entity_category: config
    on_press:
      - lambda: warre_auth::reset();
    web_server:
      sorting_group_id: grp_maintenance
      sorting_weight: 30

  # Zigbee router firmware only: join an open network / leave it (CLI on the radio's UART).
  - platform: template
    name: "Zigbee router: join network"
    icon: mdi:link-variant-plus
    entity_category: config
    on_press:
      - lambda: id(radio_update).router_join();
    web_server:
      sorting_group_id: grp_radio_fw
      sorting_weight: 50

  - platform: template
    name: "Zigbee router: leave network"
    icon: mdi:link-variant-off
    entity_category: config
    disabled_by_default: true
    on_press:
      - lambda: id(radio_update).router_leave();
    web_server:
      sorting_group_id: grp_radio_fw
      sorting_weight: 51

  - platform: restart
    name: "Restart gateway"
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: grp_maintenance
      sorting_weight: 40

  - platform: safe_mode
    name: "Restart gateway in safe mode"
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: grp_maintenance
      sorting_weight: 50
